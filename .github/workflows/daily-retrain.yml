name: TradeMind daily validated retrain

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trademind-daily-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONPATH: backend
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRADING_CANDLE_INTERVAL: 15m
      TRADING_MARKET_MODE: spot
      ML_SERVING_HORIZON_BARS: 4

    steps:
      - name: Check out the incumbent bundle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run outcome resolution and validated retraining
        id: retrain
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m app.ml.retrain_from_supabase 2>&1 | tee phase4_retrain.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            if grep -q "Candidate rejected by out-of-sample anti-regression gate" phase4_retrain.log; then
              echo "promoted=false" >> "$GITHUB_OUTPUT"
              echo "Candidate rejected; incumbent bundle remains unchanged."
            else
              exit "$status"
            fi
          elif python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("phase4_retrain_result.json").read_text())
          raise SystemExit(0 if report.get("promotion_decision") == "promoted" else 1)
          PY
          then
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            echo "Retraining completed without promotion; incumbent bundle remains unchanged."
          fi

      - name: Commit validated promoted artifacts
        if: steps.retrain.outputs.promoted == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/models/current backend/reports/phase4_retrain_result.json
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "chore(models): promote validated daily retrain"
            git push
          fi

      - name: Upload retraining audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-retrain-${{ github.run_id }}
          path: |
            backend/reports/phase4_retrain_result.json
            backend/phase4_retrain.log
          if-no-files-found: ignore
